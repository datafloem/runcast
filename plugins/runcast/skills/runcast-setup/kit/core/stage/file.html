<!doctype html>
<!--
  Runcast's file viewer for the stage tab (rec.download with { open }): a
  plain, app-agnostic window showing a downloaded file. The kit opens this
  page and calls window.runcastShowFile({ name, size, kind, content }):
  kind "table" (content: the text, csv or tsv by the name), "text"
  (content: the text; JSON already pretty-printed), "image" (content: a
  data: URL), "pdf" (content: a data: URL) or "other" (no content: the
  file's icon, name and size). Light and dark follow the browser. Loads
  nothing from the network.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>File</title>
    <style>
      :root {
        --desk: #e9ebef;
        --window: #ffffff;
        --bar: #f5f6f8;
        --line: #e3e5e9;
        --text: #1f2328;
        --muted: #6b7280;
        --stripe: #f7f8fa;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --desk: #1b1c1f;
          --window: #2b2d31;
          --bar: #313338;
          --line: #3c3f45;
          --text: #e6e6e6;
          --muted: #9aa0a6;
          --stripe: #303237;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--desk);
        font: 14px/1.4 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        cursor: default;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .window {
        width: min(960px, 82vw);
        height: min(620px, 80vh);
        display: flex;
        flex-direction: column;
        background: var(--window);
        border-radius: 12px;
        box-shadow:
          0 24px 64px rgba(0, 0, 0, 0.28),
          0 0 0 1px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 52px;
        padding: 0 18px;
        background: var(--bar);
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .bar .title {
        font-weight: 600;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .bar .meta {
        margin-left: auto;
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }
      .icon {
        flex: none;
        width: 24px;
        height: 30px;
        border-radius: 3px 8px 3px 3px;
        background: var(--badge, #8b95a5);
        color: #fff;
        font-size: 8px;
        font-weight: 700;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 4px;
        box-sizing: border-box;
      }
      .body {
        flex: 1;
        overflow: hidden;
        min-height: 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 9px 16px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 320px;
      }
      th {
        position: sticky;
        top: 0;
        background: var(--bar);
        font-weight: 600;
      }
      tbody tr:nth-child(even) td {
        background: var(--stripe);
      }
      td.number {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      pre {
        margin: 0;
        padding: 18px 22px;
        font: 14px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .picture {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: repeating-conic-gradient(var(--stripe) 0 25%, var(--window) 0 50%) 0 0 / 20px 20px;
      }
      .picture img {
        max-width: 92%;
        max-height: 92%;
        object-fit: contain;
      }
      embed {
        width: 100%;
        height: 100%;
        border: 0;
      }
      .card {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .card .icon {
        width: 72px;
        height: 90px;
        font-size: 18px;
        border-radius: 8px 22px 8px 8px;
        padding-bottom: 12px;
      }
      .card .name {
        font-size: 20px;
        font-weight: 600;
      }
      .card .meta {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="bar">
        <span class="icon" id="icon"></span>
        <span class="title" id="title" data-file-name></span>
        <span class="meta" id="meta"></span>
      </div>
      <div class="body" id="body"></div>
    </div>
    <script>
      const colours = {
        pdf: "#d93f3f", csv: "#1e9e5a", tsv: "#1e9e5a", xlsx: "#1e9e5a", xls: "#1e9e5a",
        png: "#7c4dff", jpg: "#7c4dff", jpeg: "#7c4dff", gif: "#7c4dff", webp: "#7c4dff", svg: "#7c4dff",
        doc: "#2f6feb", docx: "#2f6feb", txt: "#6b7280", md: "#6b7280", json: "#c98a00",
        zip: "#8a6d3b", mp4: "#e0457b", mov: "#e0457b", mp3: "#e0457b",
      };
      // As Chrome names sizes: 512 B, 2.0 KB, 150 KB, 1.2 MB.
      const size = (bytes) => {
        const units = ["B", "KB", "MB", "GB"];
        let value = bytes;
        let unit = 0;
        while (value >= 1024 && unit < units.length - 1) {
          value /= 1024;
          unit += 1;
        }
        return unit === 0 ? `${bytes} B` : `${value < 100 ? value.toFixed(1) : Math.round(value)} ${units[unit]}`;
      };
      const iconFor = (el, name) => {
        const ext = (name.split(".").pop() || "").toLowerCase();
        el.style.setProperty("--badge", colours[ext] ?? "#8b95a5");
        el.textContent = ext.slice(0, 4).toUpperCase();
      };
      // RFC 4180: quoted fields may hold the separator, quotes ("") and line breaks.
      const parse = (text, sep) => {
        const rows = [];
        let row = [];
        let field = "";
        let quoted = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (quoted) {
            if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
            else if (c === '"') quoted = false;
            else field += c;
          } else if (c === '"') quoted = true;
          else if (c === sep) { row.push(field); field = ""; }
          else if (c === "\n" || c === "\r") {
            if (c === "\r" && text[i + 1] === "\n") i++;
            row.push(field); rows.push(row); row = []; field = "";
          } else field += c;
        }
        if (field !== "" || row.length) { row.push(field); rows.push(row); }
        return rows;
      };
      window.runcastShowFile = ({ name, size: bytes, kind, content }) => {
        document.title = name;
        document.getElementById("title").textContent = name;
        document.getElementById("meta").textContent = size(bytes);
        iconFor(document.getElementById("icon"), name);
        const body = document.getElementById("body");
        body.replaceChildren();
        if (kind === "table") {
          const rows = parse(content, name.toLowerCase().endsWith(".tsv") ? "\t" : ",").slice(0, 200);
          const table = document.createElement("table");
          const head = table.createTHead().insertRow();
          for (const cell of rows[0] ?? []) {
            const th = document.createElement("th");
            th.textContent = cell;
            head.append(th);
          }
          const tbody = table.createTBody();
          for (const cells of rows.slice(1)) {
            const tr = tbody.insertRow();
            for (const cell of cells) {
              const td = tr.insertCell();
              td.textContent = cell;
              if (/^-?[\d.,\s]+%?$/.test(cell.trim()) && /\d/.test(cell)) td.className = "number";
            }
          }
          body.append(table);
        } else if (kind === "text") {
          const pre = document.createElement("pre");
          pre.textContent = content;
          body.append(pre);
        } else if (kind === "image") {
          const box = document.createElement("div");
          box.className = "picture";
          const img = document.createElement("img");
          img.src = content;
          img.alt = name;
          box.append(img);
          body.append(box);
          return new Promise((done) => {
            img.onload = img.onerror = () => done();
          });
        } else if (kind === "pdf") {
          const embed = document.createElement("embed");
          embed.type = "application/pdf";
          embed.src = content;
          body.append(embed);
        } else {
          const card = document.createElement("div");
          card.className = "card";
          card.dataset.fileCard = "";
          const icon = document.createElement("span");
          icon.className = "icon";
          iconFor(icon, name);
          const label = document.createElement("div");
          label.className = "name";
          label.textContent = name;
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = size(bytes);
          card.append(icon, label, meta);
          body.append(card);
        }
      };
    </script>
  </body>
</html>
