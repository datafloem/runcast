<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sample App — Home</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      header {
        padding: 24px 40px;
        background: #1e293b;
        font-size: 20px;
      }
      main {
        padding: 40px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
      section {
        background: #1e293b;
        border-radius: 16px;
        padding: 24px;
        min-height: 160px;
      }
    </style>
  </head>
  <body>
    <header>Sample App</header>
    <main>
      <section>
        <h2>Jobs</h2>
        <p>12 running</p>
      </section>
      <section>
        <h2>Sources</h2>
        <p>4 connected</p>
      </section>
      <section>
        <h2>Alerts</h2>
        <p>None</p>
      </section>
    </main>
  </body>
</html>
