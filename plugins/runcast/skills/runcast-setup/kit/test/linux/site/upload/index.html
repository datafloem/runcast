<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sample App — Upload</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      header {
        padding: 24px 40px;
        background: #1e293b;
        font-size: 20px;
      }
      main {
        padding: 40px;
        display: grid;
        gap: 24px;
        max-width: 760px;
      }
      #zone {
        display: grid;
        place-items: center;
        height: 220px;
        border: 2px dashed #475569;
        border-radius: 16px;
        color: #94a3b8;
        font-size: 18px;
      }
      #zone.over {
        border-color: #f97316;
        background: rgba(249, 115, 22, 0.08);
        color: #e2e8f0;
      }
      button {
        justify-self: start;
        font-size: 16px;
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        background: #f97316;
        color: #fff;
      }
      ul {
        margin: 0;
        padding-left: 20px;
      }
    </style>
  </head>
  <body>
    <header>Sample App</header>
    <main>
      <div id="zone">Drop files here</div>
      <button id="choose">Choose files</button>
      <input id="file" type="file" multiple hidden />
      <ul id="uploaded"></ul>
    </main>
    <script>
      // A drop zone like most upload widgets: it accepts a drop only after
      // dragover allowed it.
      const zone = document.getElementById("zone");
      const list = document.getElementById("uploaded");
      const show = (files) => {
        for (const file of files) {
          const item = document.createElement("li");
          item.textContent = `${file.name} (${file.size} bytes)`;
          list.append(item);
        }
      };
      zone.addEventListener("dragenter", () => zone.classList.add("over"));
      zone.addEventListener("dragover", (event) => event.preventDefault());
      zone.addEventListener("dragleave", () => zone.classList.remove("over"));
      zone.addEventListener("drop", (event) => {
        event.preventDefault();
        zone.classList.remove("over");
        show(event.dataTransfer.files);
      });
      document.getElementById("choose").addEventListener("click", () =>
        document.getElementById("file").click(),
      );
      document.getElementById("file").addEventListener("change", (event) =>
        show(event.target.files),
      );
    </script>
  </body>
</html>
