name: Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to make?
      description: Describe the video, test or workflow you're trying to make, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Runcast help? An example scenario with the made-up customers/orders app helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you tried, or other ways to solve it.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this.
